{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mr. Bee's World{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">Mr. Bee & Friends</a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/story/">Story</a></li>
                    <li class="nav-item"><a class="nav-link" href="/characters/">Characters</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact/">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="my-5">
    {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <p class="footer-brand"> Mr. Bee & Friends</p>
            <ul class="list-inline mb-3">
                <li class="list-inline-item"><a href="/">Home</a></li>
                <li class="list-inline-item footer-dot">·</li>
                <li class="list-inline-item"><a href="/story/">Story</a></li>
                <li class="list-inline-item footer-dot">·</li>
                <li class="list-inline-item"><a href="/characters/">Characters</a></li>
                <li class="list-inline-item footer-dot">·</li>
                <li class="list-inline-item"><a href="/contact/">Contact</a></li>
            </ul>
            <p class="footer-copy">© 2026 Mr. Bee's World. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
