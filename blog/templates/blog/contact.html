{% extends 'blog/base.html' %}
{% block title %}Contact - Mr. Bee's World{% endblock %}

{% block content %}
    <div class="container">
        <section id="contact" class="py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <h2 class="text-center mb-4">Get in Touch!</h2>
                    <p class="text-center mb-4">Want to introduce new friend to Mr.Bee's world?</p>

                    {% if success %}
                    <div class="alert" style="background-color: #FFF0BB; color: #3D2B1F; border: none; border-radius: 8px; padding: 1rem;">
                            Thank you for your message! 🐝 We'll get back to you soon.
                    </div>
                    {% endif %}

                    <form method="POST" action="/contact/">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Queen Bee" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Your Email</label>
                            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea name="message" class="form-control" rows="5" placeholder="Your message..." required></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-honey btn-lg px-5">Send Message</button>
                        </div>
                    </form>

                </div>
            </div>
        </section>
    </div>
{% endblock %}
